<!doctype html>
<html lang="de" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F0F2F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D111E" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Study" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap"
    />
    <title>Study App</title>
    <script>
      // Gespeichertes Design sofort setzen, damit der Startbildschirm nicht in der falschen Farbe aufblitzt
      try {
        var t = localStorage.getItem('study-app-theme');
        document.documentElement.setAttribute('data-theme', t === 'dark' || t === 'auto' ? t : 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Startbild, bis die App geladen ist. Gleiche Form wie SplashScreen.tsx, React ersetzt es beim Start. -->
      <div class="splash" role="status" aria-live="polite">
        <svg class="splash-mark" viewBox="0 0 120 120" width="96" height="96" aria-hidden="true">
          <rect class="splash-tile" width="120" height="120" rx="28" />
          <path class="splash-s" pathLength="100" d="M83 42 C75 24 36 26 36 46 C36 66 84 56 84 76 C84 96 46 98 34 80" fill="none" stroke-width="16" stroke-linecap="round" />
          <circle class="splash-dot" cx="90" cy="32" r="9" />
        </svg>
        <div class="splash-name">Study App</div>
        <div class="splash-dots" aria-hidden="true"><i></i><i></i><i></i></div>
        <p class="splash-label"></p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
